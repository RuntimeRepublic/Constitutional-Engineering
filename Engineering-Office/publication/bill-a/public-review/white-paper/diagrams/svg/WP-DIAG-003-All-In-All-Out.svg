<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="t3 d3">
  <title id="t3">WP-DIAG-003 — ALL-IN / ALL-OUT current status</title>
  <desc id="d3">Every county eliminates property tax. ALL-IN is the primary active candidate and is not Human-accepted. ALL-OUT is a deferred candidate on explicit hold: not retired, not active, not a coequal current path.</desc>
  <rect width="920" height="720" fill="#f7f5f0"/>
  <text x="460" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1a2332">WP-DIAG-003 — ALL-IN / ALL-OUT STATUS</text>
  <text x="460" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5a6575">Property tax reaches zero statewide — ALL-OUT is not a current coequal path</text>
  <defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1a2332"/></marker></defs>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#1a2332">
    <rect x="310" y="75" width="300" height="48" rx="4" fill="#1a2332"/>
    <text x="460" y="105" text-anchor="middle" fill="#f7f5f0" font-size="14">EVERY KANSAS COUNTY</text>
    <line x1="460" y1="123" x2="460" y2="150" stroke="#1a2332" stroke-width="2" marker-end="url(#a3)"/>
    <rect x="260" y="152" width="400" height="48" rx="4" fill="#2f4a2f"/>
    <text x="460" y="182" text-anchor="middle" fill="#f7f5f0" font-size="14">PROPERTY TAX = ZERO</text>

    <rect x="40" y="230" width="400" height="200" rx="4" fill="#ffffff" stroke="#3a4f3a" stroke-width="2"/>
    <rect x="40" y="230" width="400" height="44" fill="#3a4f3a"/>
    <text x="240" y="258" text-anchor="middle" fill="#f7f5f0" font-size="14">ALL-IN</text>
    <text x="60" y="300" font-size="13">PRIMARY ACTIVE CANDIDATE</text>
    <text x="60" y="324" font-size="13">NOT HUMAN-ACCEPTED</text>
    <text x="60" y="356" font-size="12">New Bill A local architecture</text>
    <text x="60" y="378" font-size="12">TRR / NBBF / ARR (not calculated)</text>
    <text x="60" y="400" font-size="12">Fiscal mechanics not complete</text>

    <rect x="480" y="230" width="400" height="200" rx="4" fill="#ffffff" stroke="#6a5530" stroke-width="2"/>
    <rect x="480" y="230" width="400" height="44" fill="#6a5530"/>
    <text x="680" y="258" text-anchor="middle" fill="#f7f5f0" font-size="14">ALL-OUT</text>
    <text x="500" y="300" font-size="13">DEFERRED CANDIDATE</text>
    <text x="500" y="324" font-size="13">EXPLICIT HOLD</text>
    <text x="500" y="356" font-size="12">Not retired — not active</text>
    <text x="500" y="378" font-size="12">Not a coequal current path</text>
    <text x="500" y="400" font-size="12">Engineering not resumed</text>

    <rect x="40" y="460" width="840" height="70" rx="4" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
    <text x="460" y="488" text-anchor="middle" font-size="13">Runway decision remains: 5-year maximum or 7-year maximum</text>
    <text x="460" y="512" text-anchor="middle" font-size="12">Maximum transition period — not a guaranteed collection period</text>

    <rect x="200" y="555" width="520" height="42" rx="4" fill="#eef3ea" stroke="#2f4a2f" stroke-width="1.5"/>
    <text x="460" y="582" text-anchor="middle" font-size="14" font-weight="bold">HOLD DOES NOT RESTORE PROPERTY TAX</text>
  </g>
  <text x="460" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5a6575">Source: LOU-004 Draft 1.11 §2.0.4–§2.0.5 — Status: CONCEPTUAL EXPLANATION</text>
  <text x="460" y="690" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7a8494">Historical dual-path design is traceability only — not current active architecture</text>
</svg>
