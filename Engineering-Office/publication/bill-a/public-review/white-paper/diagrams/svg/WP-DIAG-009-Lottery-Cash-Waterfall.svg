<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820" role="img" aria-labelledby="t9 d9">
  <title id="t9">WP-DIAG-009  Lottery Cash Waterfall</title>
  <desc id="d9">Definition architecture from gross Lottery cash receipts through prizes, 4 percent post-prize Rule-of-72 partition, evidenced unavoidable costs, 90/10 base, available governmental cash, and property-tax abatement or retirement. Not a certified fiscal result.</desc>
  <rect width="920" height="780" fill="#f7f5f0"/>
  <text x="460" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1a2332">WP-DIAG-009  LOTTERY CASH WATERFALL</text>
  <text x="460" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5a6575">Definition architecture  not a certified fiscal result  not current Kansas Lottery law</text>
  <defs><marker id="a9" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1a2332"/></marker></defs>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#1a2332">
    <rect x="260" y="70" width="400" height="42" rx="4" fill="#1a2332"/>
    <text x="460" y="97" text-anchor="middle" fill="#f7f5f0" font-size="13">GROSS LOTTERY CASH RECEIPTS</text>
    <line x1="460" y1="112" x2="460" y2="132" stroke="#1a2332" stroke-width="2" marker-end="url(#a9)"/>
    <rect x="260" y="134" width="400" height="42" rx="4" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
    <text x="460" y="161" text-anchor="middle" font-size="13">PRIZE OBLIGATIONS</text>
    <line x1="460" y1="176" x2="460" y2="196" stroke="#1a2332" stroke-width="2" marker-end="url(#a9)"/>
    <rect x="260" y="198" width="400" height="42" rx="4" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
    <text x="460" y="225" text-anchor="middle" font-size="13">POST-PRIZE CASH</text>
    <line x1="460" y1="240" x2="460" y2="260" stroke="#1a2332" stroke-width="2" marker-end="url(#a9)"/>
    <rect x="260" y="262" width="400" height="50" rx="4" fill="#ffffff" stroke="#2a3a55" stroke-width="1.5"/>
    <text x="460" y="283" text-anchor="middle" font-size="13">4% RULE-OF-72 INDIVIDUAL PARTITION</text>
    <text x="460" y="301" text-anchor="middle" font-size="11" fill="#5a6575">of post-prize revenue  not of gross sales</text>
    <line x1="460" y1="312" x2="460" y2="332" stroke="#1a2332" stroke-width="2" marker-end="url(#a9)"/>
    <rect x="220" y="334" width="480" height="42" rx="4" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
    <text x="460" y="361" text-anchor="middle" font-size="13">EVIDENCED UNAVOIDABLE DIRECT ECONOMIC COSTS</text>
    <line x1="460" y1="376" x2="460" y2="396" stroke="#1a2332" stroke-width="2" marker-end="url(#a9)"/>
    <rect x="220" y="398" width="480" height="50" rx="4" fill="#3a4f3a"/>
    <text x="460" y="420" text-anchor="middle" fill="#f7f5f0" font-size="13">90/10 ENGINEERING BASE</text>
    <text x="460" y="438" text-anchor="middle" fill="#f7f5f0" font-size="11">feasibility NOT CERTIFIED</text>
    <line x1="340" y1="448" x2="220" y2="490" stroke="#1a2332" stroke-width="1.5" marker-end="url(#a9)"/>
    <line x1="580" y1="448" x2="700" y2="490" stroke="#1a2332" stroke-width="1.5" marker-end="url(#a9)"/>
    <rect x="40" y="495" width="360" height="70" rx="4" fill="#eef3ea" stroke="#2f4a2f" stroke-width="1.5"/>
    <text x="220" y="525" text-anchor="middle" font-size="13" font-weight="bold">90 SIDE</text>
    <text x="220" y="548" text-anchor="middle" font-size="12">AVAILABLE GOVERNMENTAL CASH</text>
    <rect x="520" y="495" width="360" height="70" rx="4" fill="#f4efe6" stroke="#6a5530" stroke-width="1.5"/>
    <text x="700" y="525" text-anchor="middle" font-size="13" font-weight="bold">10 SIDE</text>
    <text x="700" y="548" text-anchor="middle" font-size="12">CEILING / NOT SPENDING ENTITLEMENT</text>
    <line x1="220" y1="565" x2="460" y2="600" stroke="#1a2332" stroke-width="1.5" marker-end="url(#a9)"/>
    <rect x="160" y="605" width="600" height="50" rx="4" fill="#2f4a2f"/>
    <text x="460" y="636" text-anchor="middle" fill="#f7f5f0" font-size="14">PROPERTY-TAX ABATEMENT / RETIREMENT</text>
    <text x="460" y="680" text-anchor="middle" font-size="12" fill="#5a6575">Primary Human-intended destination of remaining available governmental cash</text>
    <text x="460" y="700" text-anchor="middle" font-size="12" fill="#5a6575">subject to protected obligations Bill A cannot impair  not an appropriation</text>
  </g>
  <text x="460" y="745" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5a6575">Source: LOU-004 Draft 1.12 sec. 2.0.11 - Q-BILL-A-012 through Q-BILL-A-015 - candidate proving ground</text>
  <text x="460" y="770" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5a6575">4% / 90/10 / 50-50 remain initial recorded values. 90/10 not certified. Bound, operate, measure, compare, correct, prove; expand only through lawful authority.</text>
</svg>
