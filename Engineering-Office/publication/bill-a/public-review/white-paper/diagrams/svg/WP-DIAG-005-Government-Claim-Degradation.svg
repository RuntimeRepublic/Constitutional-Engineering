<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="t5 d5">
  <title id="t5">WP-DIAG-005 - Government Claim Degradation</title>
  <desc id="d5">Zero Terminal is the durable destination. Numerical rates are initial parameters. Example 10.00% toward zero at 0.25 percentage points every three months. Example only.</desc>
  <rect width="900" height="620" fill="#f7f5f0"/>
  <text x="450" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1a2332">WP-DIAG-005 - Government Claim Degradation</text>
  <text x="450" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5a6575">Controlled example - Not a Kansas rate - Destination is durable; rate is an initial parameter</text>
  <defs><marker id="a5" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 Z" fill="#1a2332"/></marker></defs>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#1a2332">
    <rect x="30" y="90" width="110" height="56" rx="4" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
    <text x="85" y="124" text-anchor="middle" font-size="16">10.00%</text>
    <line x1="145" y1="118" x2="175" y2="118" stroke="#1a2332" stroke-width="1.5" marker-end="url(#a5)"/>
    <rect x="180" y="90" width="110" height="56" rx="4" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
    <text x="235" y="124" text-anchor="middle" font-size="16">9.75%</text>
    <line x1="295" y1="118" x2="325" y2="118" stroke="#1a2332" stroke-width="1.5" marker-end="url(#a5)"/>
    <rect x="330" y="90" width="110" height="56" rx="4" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
    <text x="385" y="124" text-anchor="middle" font-size="16">9.50%</text>
    <line x1="445" y1="118" x2="475" y2="118" stroke="#1a2332" stroke-width="1.5" marker-end="url(#a5)"/>
    <rect x="480" y="90" width="110" height="56" rx="4" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
    <text x="535" y="124" text-anchor="middle" font-size="16">9.25%</text>
    <line x1="595" y1="118" x2="625" y2="118" stroke="#1a2332" stroke-width="1.5" marker-end="url(#a5)"/>
    <rect x="630" y="90" width="110" height="56" rx="4" fill="#ffffff" stroke="#1a2332" stroke-width="1.5"/>
    <text x="685" y="124" text-anchor="middle" font-size="16">9.00%</text>
    <line x1="745" y1="118" x2="775" y2="118" stroke="#1a2332" stroke-width="1.5" marker-end="url(#a5)"/>
    <text x="800" y="110" font-size="16">...</text>
    <rect x="750" y="180" width="120" height="56" rx="4" fill="#eef3ea" stroke="#2f4a2f" stroke-width="1.5"/>
    <text x="810" y="214" text-anchor="middle" font-size="16" font-weight="bold">0.00%</text>

    <rect x="80" y="200" width="520" height="70" rx="4" fill="#ffffff" stroke="#1a2332" stroke-width="1"/>
    <text x="340" y="230" text-anchor="middle" font-size="13" font-weight="bold">-0.25 PERCENTAGE POINTS EVERY THREE MONTHS</text>
    <text x="340" y="252" text-anchor="middle" font-size="12">= -1.00 percentage point per full year - initial parameter - not compounded</text>

    <rect x="80" y="290" width="740" height="90" rx="4" fill="#ffffff" stroke="#2a3a55" stroke-width="1.5"/>
    <text x="450" y="320" text-anchor="middle" font-size="13" font-weight="bold">FIXED-DOLLAR PATH (separate initial parameter)</text>
    <text x="450" y="345" text-anchor="middle" font-size="12">1% of original starting amount per full year - noncompounded - toward zero</text>
    <text x="450" y="365" text-anchor="middle" font-size="12">Example: $10.00 - $9.90 - $9.80 - ... - $0.00  (quarterly/rounding mechanics unresolved)</text>

    <rect x="40" y="400" width="400" height="70" rx="4" fill="#2f4a2f"/>
    <text x="240" y="430" text-anchor="middle" fill="#f7f5f0" font-size="14" font-weight="bold">DESTINATION (durable rail)</text>
    <text x="240" y="454" text-anchor="middle" fill="#f7f5f0" font-size="13">ZERO TERMINAL</text>
    <rect x="460" y="400" width="400" height="70" rx="4" fill="#ffffff" stroke="#6a5530" stroke-width="1.5"/>
    <text x="660" y="430" text-anchor="middle" font-size="14" font-weight="bold">RATE (initial parameter)</text>
    <text x="660" y="454" text-anchor="middle" font-size="12">Numbers unchanged; not automatically eternal</text>
  </g>
  <text x="450" y="520" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5a6575">Source: LOU-004 Draft 1.12 sec. 2.0.8 / 2.0.14 - Degradation does not authorize a claim - PDCA does not weaken Zero Terminal</text>
  <text x="450" y="560" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7a8494">BlueprintLiberty.com - https://github.com/jhodges07/Constitutional-Engineering</text>
</svg>
